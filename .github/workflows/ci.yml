name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install real Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # This disposable runner must permit bubblewrap user namespaces.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / -- /bin/true
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/gemini_orchestrator
      - run: python -m pytest -q --junitxml=test-results.xml
      - name: Require sandbox boundary tests to execute
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('test-results.xml')
          required = {'test_os_sandbox_enforces_write_boundary', 'test_real_connected_worker_with_synthetic_cli', 'test_native_gemini_session_id_is_resumed_exactly', 'test_verification_cannot_read_controller_or_send_network', 'test_worker_cannot_read_bridge_or_other_worktree', 'test_read_only_question_has_os_write_denial', 'test_connected_read_only_question_uses_separate_policy', 'test_verification_cannot_read_host_process_environment', 'test_connected_planning_is_read_only_and_resumed'}
          cases = {c.get('name'): c for c in root.iter('testcase') if c.get('name') in required}
          assert set(cases) == required
          assert all(c.find('skipped') is None for c in cases.values()), 'Required sandbox tests were skipped'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          retention-days: 7
      - run: gemini-orchestrator test
      - run: python -m build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1 detect-secrets==1.5.0
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - run: python scripts/check_secrets.py
